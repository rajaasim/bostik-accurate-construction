<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  
  <defs>
    <!-- Rich Metallic Qatar Gold Gradient -->
    <linearGradient id="bac_mark_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D1" />
      <stop offset="20%" stop-color="#F7D472" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#A2781E" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>

    <!-- Deep Metallic Shadow Gold -->
    <linearGradient id="bac_mark_goldDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#B88A22" />
      <stop offset="100%" stop-color="#7B570A" />
    </linearGradient>

    <!-- Architectural Deep Navy / Slate Gradient -->
    <linearGradient id="bac_mark_navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E62" />
      <stop offset="45%" stop-color="#10253F" />
      <stop offset="100%" stop-color="#07121E" />
    </linearGradient>

    <!-- Precision Cyan Technical Glow -->
    <linearGradient id="bac_mark_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Radial Gold Ambient Aura -->
    <radialGradient id="bac_mark_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    <!-- High-Definition Drop Shadow -->
    <filter id="bac_mark_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&amp;family=Tajawal:wght@500;700;800&amp;display=swap');
      .bac-title { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
      .bac-sub { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .bac-ar { font-family: 'Tajawal', 'Traditional Arabic', 'Segoe UI', sans-serif; font-weight: 700; }
      .bac-mono { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-weight: 600; }
    </style>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect width="512" height="512" rx="112" fill="#07111F" stroke="rgba(212,175,55,0.4)" stroke-width="3" />

  <!-- Subtle Radial Background Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#bac_mark_glow)" opacity="0.18" />

  <!-- Architectural Corner Drafting Guides -->
  <g stroke="url(#bac_mark_gold)" stroke-width="1.5" opacity="0.4">
    <path d="M 48 80 L 48 48 L 80 48" fill="none" />
    <path d="M 464 80 L 464 48 L 432 48" fill="none" />
    <path d="M 48 432 L 48 464 L 80 464" fill="none" />
    <path d="M 464 432 L 464 464 L 432 464" fill="none" />
  </g>

  <!-- Centered Emblem (Scaled 2.0x) -->
  <g transform="translate(56, 56) scale(2.0)" filter="url(#bac_mark_shadow)">
    
    <g id="bac_mark_emblem_group">
      <!-- Ambient Glow Behind Mark -->
      <circle cx="100" cy="95" r="72" fill="url(#bac_mark_glow)" opacity="0.14" />

      <!-- 1. FOUNDATION PILLAR (Left Structural Column of B & Foundation Anchor) -->
      <!-- Perspective Side Facet -->
      <polygon points="26,62 44,48 44,152 26,166" fill="#060E18" opacity="0.9" stroke="#1E3E62" stroke-width="1" />
      <!-- Main Front Facet -->
      <polygon points="44,48 70,34 70,166 44,152" fill="url(#bac_mark_navy)" stroke="#2A4D74" stroke-width="1.2" />

      <!-- 2. ASCENDING "A" SPIRE (Tower / Rafters) -->
      <!-- Left Rafter of A -->
      <polygon points="100,14 70,68 70,92 100,42" fill="url(#bac_mark_gold)" />
      <!-- Right Rafter of A -->
      <polygon points="100,14 100,42 116,68 132,68" fill="url(#bac_mark_goldDeep)" />
      <!-- Negative Space Triangular Keystone -->
      <polygon points="100,44 86,68 114,68" fill="#07111F" />

      <!-- 3. PRECISION CROSSBEAM & LEVEL -->
      <g>
        <!-- Beam Body -->
        <polygon points="56,92 144,92 140,106 60,106" fill="url(#bac_mark_gold)" />
        <!-- Precision Calibration Line -->
        <line x1="64" y1="99" x2="136" y2="99" stroke="#0B192C" stroke-width="1.2" opacity="0.75" />
        <!-- Center Accuracy Reticle (Digital / Optical Level) -->
        <circle cx="100" cy="99" r="4.5" fill="#0B192C" />
        <circle cx="100" cy="99" r="2.5" fill="url(#bac_mark_cyan)" />
        <circle cx="100" cy="99" r="0.8" fill="#FFFFFF" />
      </g>

      <!-- 4. UPPER CANTILEVER OF "B" -->
      <path d="M 70,44 L 132,44 C 158,44 168,56 168,70 C 168,84 156,92 132,92 L 70,92 Z" 
            fill="url(#bac_mark_gold)" />
      <!-- Inner Cutout Window -->
      <path d="M 88,58 L 128,58 C 142,58 148,62 148,70 C 148,78 142,82 128,82 L 88,82 Z" 
            fill="#07111F" />

      <!-- 5. LOWER CANTILEVER OF "B" (Substructure Deck) -->
      <path d="M 70,104 L 138,104 C 168,104 178,118 178,138 C 178,158 162,170 134,170 L 70,170 Z" 
            fill="url(#bac_mark_gold)" />
      <!-- Inner Cutout Window -->
      <path d="M 88,118 L 132,118 C 148,118 156,124 156,138 C 156,150 148,156 132,156 L 88,156 Z" 
            fill="#07111F" />

      <!-- 6. PINPOINT ACCURACY APEX NEEDLE & COMPASS SPARK -->
      <circle cx="100" cy="14" r="3" fill="#FFFFFF" />
      <path d="M 100,2 L 102,11 L 111,13 L 102,15 L 100,24 L 98,15 L 89,13 L 98,11 Z" fill="#FFF8DB" />
    </g>
  
  </g>

  <!-- Micro Brand Tag at Bottom -->
  <text x="256" y="472" class="bac-sub" font-size="16" fill="url(#bac_mark_gold)" text-anchor="middle" letter-spacing="0.32em">
    BOSTIK ACCURATE
  </text>
</svg>
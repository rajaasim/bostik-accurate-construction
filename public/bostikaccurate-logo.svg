<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Rich Qatar Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A2781E" />
    </linearGradient>

    <!-- Deep Architectural Navy Gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E62" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
  </defs>

  <!-- ==================== BOSTIK ACCURATE LOGO MARK ==================== -->
  <g id="bostik-accurate-mark">
    <!-- 1. Left Foundation Column (Structural Spine) -->
    <rect x="12" y="25" width="16" height="64" rx="3.5" fill="url(#navyGrad)" />

    <!-- 2. Precision Ascending Spire (Apex of 'A' / High-Rise Accuracy) -->
    <polygon points="20,11 28,25 12,25" fill="url(#goldGrad)" />

    <!-- 3. Upper Cantilever Loop of 'B' -->
    <path fill-rule="evenodd" clip-rule="evenodd"
          d="M 34 25 L 64 25 C 77 25 86 31.5 86 39.5 C 86 47.5 77 54 64 54 L 34 54 Z
             M 46 33 L 62 33 C 68 33 73 36 73 39.5 C 73 43 68 46 62 46 L 46 46 Z"
          fill="url(#goldGrad)" />

    <!-- 4. Lower Cantilever Loop of 'B' -->
    <path fill-rule="evenodd" clip-rule="evenodd"
          d="M 34 60 L 66 60 C 79 60 88 66.5 88 74.5 C 88 82.5 79 89 66 89 L 34 89 Z
             M 46 68 L 64 68 C 70 68 75 71 75 74.5 C 75 78 70 81 64 81 L 46 81 Z"
          fill="url(#goldGrad)" />
  </g>
</svg>
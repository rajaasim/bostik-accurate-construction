<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 84" width="100%" height="100%" fill="none">
  <defs>
    <!-- Rich Metallic Qatar Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3CA52" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A2781E" />
    </linearGradient>

    <!-- Deep Architectural Navy Gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E62" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
  </defs>

  <!-- ==================== ICON MARK (x: 10 to 76, y: 7 to 77) ==================== -->
  <g transform="translate(10, 7)">
    <!-- 1. Left Foundation Column (Structural Spine) -->
    <rect x="4" y="14" width="14" height="56" rx="3" fill="url(#navyGrad)" />

    <!-- 2. Precision Ascending Spire (Apex of A / High-Rise Accuracy) -->
    <polygon points="11,2 20,12 2,12" fill="url(#goldGrad)" />

    <!-- 3. Upper Cantilever Loop of 'B' (with integrated transparent cutout) -->
    <path fill-rule="evenodd" clip-rule="evenodd"
          d="M 23 14 L 46 14 C 58 14 66 20 66 29 C 66 38 58 41 46 41 L 23 41 Z
             M 34 22 L 44 22 C 49 22 53 25 53 28.5 C 53 32 49 33 44 33 L 34 33 Z"
          fill="url(#goldGrad)" />

    <!-- 4. Lower Cantilever Loop of 'B' (Foundation tier) -->
    <path fill-rule="evenodd" clip-rule="evenodd"
          d="M 23 43 L 48 43 C 60 43 68 49 68 59 C 68 69 60 70 48 70 L 23 70 Z
             M 34 51 L 46 51 C 51 51 55 54 55 58.5 C 55 62 51 62 46 62 L 34 62 Z"
          fill="url(#goldGrad)" />
  </g>

  <!-- ==================== TYPOGRAPHY LOCKUP ==================== -->
  <!-- Primary Brand Name: BOSTIK ACCURATE -->
  <text x="96" y="47"
        font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="34"
        font-weight="900"
        letter-spacing="0.04em">
    <tspan fill="#0B192C">BOSTIK </tspan>
    <tspan fill="url(#goldGrad)">ACCURATE</tspan>
  </text>

  <!-- Subtitle: Domain / Industry -->
  <text x="98" y="69"
        font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="12.5"
        font-weight="700"
        fill="#64748B"
        letter-spacing="0.22em">
    bostikaccurate.com
  </text>
</svg>
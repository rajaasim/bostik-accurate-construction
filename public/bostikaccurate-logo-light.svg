<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 84" width="100%" height="100%" fill="none">
  <defs>
    <!-- Rich Qatar Gold Gradient -->
    <linearGradient id="bacGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A2781E" />
    </linearGradient>

    <!-- Deep Architectural Navy Gradient -->
    <linearGradient id="bacNavyLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
  </defs>

  <!-- Clean White Background Container -->
  <rect width="100%" height="100%" rx="10" fill="#FFFFFF" />

  <!-- ==================== ICON MARK ==================== -->
  <g transform="translate(14, 6)">
    <!-- Left Foundation Pillar -->
    <rect x="4" y="14" width="14" height="56" rx="3" fill="url(#bacNavyLight)" />

    <!-- Ascending Spire (Apex of 'A' / Precision Engineering) -->
    <polygon points="11,2 18,14 4,14" fill="url(#bacGoldLight)" />

    <!-- Upper Cantilever of 'B' -->
    <path fill-rule="evenodd" clip-rule="evenodd"
          d="M 23 14 L 46 14 C 57 14 65 19.5 65 27 C 65 34.5 57 40 46 40 L 23 40 Z
             M 33 21 L 44 21 C 48.5 21 52 23.5 52 27 C 52 30.5 48.5 33 44 33 L 33 33 Z"
          fill="url(#bacGoldLight)" />

    <!-- Lower Cantilever of 'B' -->
    <path fill-rule="evenodd" clip-rule="evenodd"
          d="M 23 44 L 48 44 C 59 44 67 49.5 67 57 C 67 64.5 59 70 48 70 L 23 70 Z
             M 33 51 L 45 51 C 49.5 51 53 53.5 53 57 C 53 60.5 49.5 63 45 63 L 33 63 Z"
          fill="url(#bacGoldLight)" />
  </g>

  <!-- ==================== TYPOGRAPHY LOCKUP ==================== -->
  <!-- Primary Brand Name: BOSTIK ACCURATE -->
  <text x="100" y="46"
        font-family="'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="33"
        font-weight="900"
        letter-spacing="0.04em">
    <tspan fill="#0B192C">BOSTIK </tspan>
    <tspan fill="url(#bacGoldLight)">ACCURATE</tspan>
  </text>

  <!-- Clean Subtitle: bostikaccurate.com -->
  <text x="102" y="67"
        font-family="'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#64748B"
        letter-spacing="0.22em">
    bostikaccurate.com
  </text>
</svg>
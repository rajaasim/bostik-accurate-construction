<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%" fill="none">
  
  <defs>
    <!-- Rich Metallic Qatar Gold Gradient -->
    <linearGradient id="bac_light_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D1" />
      <stop offset="20%" stop-color="#F7D472" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#A2781E" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>

    <!-- Deep Metallic Shadow Gold -->
    <linearGradient id="bac_light_goldDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#B88A22" />
      <stop offset="100%" stop-color="#7B570A" />
    </linearGradient>

    <!-- Architectural Deep Navy / Slate Gradient -->
    <linearGradient id="bac_light_navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E62" />
      <stop offset="45%" stop-color="#10253F" />
      <stop offset="100%" stop-color="#07121E" />
    </linearGradient>

    <!-- Precision Cyan Technical Glow -->
    <linearGradient id="bac_light_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Radial Gold Ambient Aura -->
    <radialGradient id="bac_light_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    <!-- High-Definition Drop Shadow -->
    <filter id="bac_light_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&amp;family=Tajawal:wght@500;700;800&amp;display=swap');
      .bac-title { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
      .bac-sub { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .bac-ar { font-family: 'Tajawal', 'Traditional Arabic', 'Segoe UI', sans-serif; font-weight: 700; }
      .bac-mono { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-weight: 600; }
    </style>
  </defs>

  <rect width="100%" height="100%" rx="16" fill="#FFFFFF"/>

  <!-- EMBLEM ICON -->
  <g transform="translate(42, 35)" filter="url(#bac_light_shadow)">
    
    <g id="bac_light_emblem_group">
      <!-- Ambient Glow Behind Mark -->
      <circle cx="100" cy="95" r="72" fill="url(#bac_light_glow)" opacity="0.07" />

      <!-- 1. FOUNDATION PILLAR (Left Structural Column of B & Foundation Anchor) -->
      <!-- Perspective Side Facet -->
      <polygon points="26,62 44,48 44,152 26,166" fill="#060E18" opacity="0.9" stroke="#94A3B8" stroke-width="1" />
      <!-- Main Front Facet -->
      <polygon points="44,48 70,34 70,166 44,152" fill="url(#bac_light_navy)" stroke="#CBD5E1" stroke-width="1.2" />

      <!-- 2. ASCENDING "A" SPIRE (Tower / Rafters) -->
      <!-- Left Rafter of A -->
      <polygon points="100,14 70,68 70,92 100,42" fill="url(#bac_light_gold)" />
      <!-- Right Rafter of A -->
      <polygon points="100,14 100,42 116,68 132,68" fill="url(#bac_light_goldDeep)" />
      <!-- Negative Space Triangular Keystone -->
      <polygon points="100,44 86,68 114,68" fill="#FFFFFF" />

      <!-- 3. PRECISION CROSSBEAM & LEVEL -->
      <g>
        <!-- Beam Body -->
        <polygon points="56,92 144,92 140,106 60,106" fill="url(#bac_light_gold)" />
        <!-- Precision Calibration Line -->
        <line x1="64" y1="99" x2="136" y2="99" stroke="#0B192C" stroke-width="1.2" opacity="0.75" />
        <!-- Center Accuracy Reticle (Digital / Optical Level) -->
        <circle cx="100" cy="99" r="4.5" fill="#0B192C" />
        <circle cx="100" cy="99" r="2.5" fill="url(#bac_light_cyan)" />
        <circle cx="100" cy="99" r="0.8" fill="#FFFFFF" />
      </g>

      <!-- 4. UPPER CANTILEVER OF "B" -->
      <path d="M 70,44 L 132,44 C 158,44 168,56 168,70 C 168,84 156,92 132,92 L 70,92 Z" 
            fill="url(#bac_light_gold)" />
      <!-- Inner Cutout Window -->
      <path d="M 88,58 L 128,58 C 142,58 148,62 148,70 C 148,78 142,82 128,82 L 88,82 Z" 
            fill="#FFFFFF" />

      <!-- 5. LOWER CANTILEVER OF "B" (Substructure Deck) -->
      <path d="M 70,104 L 138,104 C 168,104 178,118 178,138 C 178,158 162,170 134,170 L 70,170 Z" 
            fill="url(#bac_light_gold)" />
      <!-- Inner Cutout Window -->
      <path d="M 88,118 L 132,118 C 148,118 156,124 156,138 C 156,150 148,156 132,156 L 88,156 Z" 
            fill="#FFFFFF" />

      <!-- 6. PINPOINT ACCURACY APEX NEEDLE & COMPASS SPARK -->
      <circle cx="100" cy="14" r="3" fill="#FFFFFF" />
      <path d="M 100,2 L 102,11 L 111,13 L 102,15 L 100,24 L 98,15 L 89,13 L 98,11 Z" fill="#FFF8DB" />
    </g>
  
  </g>

  <!-- VERTICAL ARCHITECTURAL DIVIDER -->
  <g transform="translate(265, 45)">
    <line x1="0" y1="10" x2="0" y2="160" stroke="rgba(212,175,55,0.65)" stroke-width="2" stroke-linecap="round" />
    <polygon points="0,4 4,10 -4,10" fill="url(#bac_light_gold)" />
    <polygon points="0,166 4,160 -4,160" fill="url(#bac_light_gold)" />
    <circle cx="0" cy="85" r="3.5" fill="url(#bac_light_gold)" />
    <circle cx="0" cy="85" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- TYPOGRAPHY & BRAND LOCKUP -->
  <g transform="translate(300, 42)">
    <!-- Primary Entity Name: BOSTIK ACCURATE -->
    <text x="0" y="58" class="bac-title" font-size="46" fill="#0B192C" letter-spacing="0.04em">
      BOSTIK <tspan fill="url(#bac_light_gold)">ACCURATE</tspan>
    </text>

    <!-- Subtitle: COMMERCIAL &amp; CIVIL CONSTRUCTION -->
    <g transform="translate(2, 92)">
      <rect x="0" y="0" width="28" height="3" rx="1.5" fill="url(#bac_light_gold)" />
      <text x="38" y="4" class="bac-sub" font-size="14" fill="url(#bac_light_gold)" letter-spacing="0.28em">
        COMMERCIAL &amp; CIVIL CONSTRUCTION
      </text>
    </g>

    <!-- Bilingual Arabic Entity & Domain Badges -->
    <g transform="translate(2, 138)">
      <!-- Official Arabic Entity Name -->
      <text x="0" y="0" class="bac-ar" font-size="21" fill="#1E293B" direction="rtl">
        بوستيك اكيوريت للانشاءات
      </text>

      <!-- Diamond Separator -->
      <polygon points="230,-6 234,-2 230,2 226,-2" fill="url(#bac_light_gold)" />

      <!-- Domain Indicator: bostikaccurate.com -->
      <text x="248" y="-1" class="bac-mono" font-size="15.5" fill="#0284C7" letter-spacing="0.06em">
        bostikaccurate.com
      </text>

      <!-- Qatar Credentials Badge -->
      <g transform="translate(470, -18)">
        <rect x="0" y="0" width="138" height="24" rx="12" fill="rgba(212,175,55,0.14)" stroke="rgba(212,175,55,0.65)" stroke-width="1" />
        <text x="69" y="15.5" class="bac-sub" font-size="10.5" fill="url(#bac_light_gold)" text-anchor="middle" letter-spacing="0.08em">
          CR # 226852 • QATAR
        </text>
      </g>
    </g>
  </g>
</svg>